services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: elder_rescue
      POSTGRES_USER: elder_rescue
      POSTGRES_PASSWORD: change-this-before-deploy
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
