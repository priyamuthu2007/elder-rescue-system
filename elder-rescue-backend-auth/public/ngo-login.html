<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Organization Sign-in — Elder Rescue Network</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F3F2FB; --paper: #FFFFFF; --ink: #1B1A2E; --ink-soft: #6B6885;
    --turq: #12B5A8; --turq-bg: #D6F5F1; --violet: #7C6CF0; --violet-bg: #EAE6FE;
    --coral: #FF6B5B; --coral-bg: #FFE7E3;
    --grad-brand: linear-gradient(120deg, #12B5A8 0%, #7C6CF0 100%);
    --line: #E5E3F3; --radius: 16px;
    --shadow: 0 2px 4px rgba(30,25,70,0.05), 0 10px 26px rgba(30,25,70,0.07);
    --shadow-lift: 0 8px 14px rgba(30,25,70,0.09), 0 22px 44px rgba(30,25,70,0.12);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background: var(--bg); color: var(--ink); font-family:'Inter', system-ui, sans-serif;
    min-height:100vh; position:relative; overflow-x:hidden;
  }
  .aurora{ position:fixed; inset:0; z-index:-1; overflow:hidden; }
  .blob{ position:absolute; border-radius:50%; filter: blur(60px); opacity:0.32; }
  .blob.b1{ width:460px; height:460px; top:-160px; right:-120px; background: var(--turq); animation: drift1 22s ease-in-out infinite; }
  .blob.b2{ width:400px; height:400px; bottom:-180px; left:-140px; background: var(--violet); animation: drift2 26s ease-in-out infinite; }
  @keyframes drift1{ 0%,100%{ transform: translate(0,0) scale(1); } 50%{ transform: translate(-40px,30px) scale(1.08); } }
  @keyframes drift2{ 0%,100%{ transform: translate(0,0) scale(1); } 50%{ transform: translate(30px,-40px) scale(1.1); } }

  .wrap{ max-width: 560px; margin: 0 auto; padding: 60px 24px 60px; }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    background: var(--grad-brand); -webkit-background-clip:text; background-clip:text; color:transparent;
    font-weight:600; margin: 0 0 10px;
  }
  h1{ font-family:'Fraunces', serif; font-weight: 700; font-size: 30px; margin:0 0 8px; letter-spacing:-0.01em; }
  .subtitle{ color: var(--ink-soft); font-size: 14px; line-height:1.55; margin: 0 0 8px; max-width: 48ch; }
  .disclaimer{
    background: var(--coral-bg); border: 1px solid #FFD2C9; border-radius: 10px; padding: 11px 13px;
    font-size: 11.5px; color: #A8402F; line-height:1.5; margin: 16px 0 26px;
  }

  .search{
    width:100%; font-size:14px; padding: 12px 15px; border-radius: 12px; border: 1.5px solid var(--line);
    background: var(--paper); margin-bottom: 16px; font-family:'Inter',sans-serif;
  }
  .search:focus{ outline:none; border-color: var(--turq); box-shadow: 0 0 0 3px var(--turq-bg); }

  .org-card{
    background: var(--paper); border: 1.5px solid var(--line); border-radius: 13px;
    padding: 15px 17px; margin-bottom: 10px; cursor:pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    animation: cardIn 0.35s backwards;
  }
  @keyframes cardIn{ from{ opacity:0; transform: translateY(8px); } to{ opacity:1; transform: translateY(0); } }
  .org-card:hover{ transform: translateY(-2px); box-shadow: var(--shadow-lift); border-color: var(--turq); }
  .org-card .name{ font-weight:700; font-size:14.5px; }
  .org-card .sub{ font-family:'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); margin-top:4px; }
  .org-card .unverified-tag{
    display:inline-block; font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em;
    background: var(--coral-bg); color:#A8402F; padding:2px 8px; border-radius:100px; margin-left:8px;
  }

  .empty{ text-align:center; padding: 40px 10px; color: var(--ink-soft); font-size:13.5px; }
  .empty a{ color: var(--turq); font-weight:700; text-decoration:underline; }

  .back-link{
    display:inline-block; margin-top: 26px; font-size:12.5px; color: var(--ink-soft);
    text-decoration:underline; font-weight:600;
  }

  .modal-backdrop{
    display:none; position:fixed; inset:0; background: rgba(27,26,46,0.45);
    align-items:center; justify-content:center; z-index:60; backdrop-filter: blur(2px);
  }
  .modal-backdrop.show{ display:flex; }
  .modal{
    background: var(--paper); border-radius: 16px; padding: 24px 26px; width: 90%; max-width: 360px;
    box-shadow: var(--shadow-lift); animation: modalIn 0.2s ease;
  }
  @keyframes modalIn{ from{ opacity:0; transform: scale(0.96); } to{ opacity:1; transform: scale(1); } }
  .modal h3{ font-family:'Fraunces', serif; font-size:18px; margin:0 0 4px; }
  .modal .org-label{ font-size:12.5px; color: var(--ink-soft); margin-bottom:16px; }
  .modal input{
    width:100%; font-size:14px; padding: 11px 14px; border-radius: 10px; border: 1.5px solid var(--line);
    margin-bottom: 10px; font-family:'Inter',sans-serif;
  }
  .modal input:focus{ outline:none; border-color: var(--turq); box-shadow: 0 0 0 3px var(--turq-bg); }
  .modal-err{ font-size:12px; color:#C43F2E; min-height:14px; margin-bottom:10px; font-weight:600; }
  .modal-actions{ display:flex; gap:9px; }
  .modal-actions button{
    flex:1; font-family:'Inter',sans-serif; font-weight:700; font-size:13px; padding:10px; border-radius:10px;
    border:none; cursor:pointer;
  }
  .modal-actions .confirm{ background: var(--grad-brand); color:#fff; }
  .modal-actions .cancel{ background: var(--slate-bg, #EBEAF3); color: var(--ink-soft); }
</style>
</head>
<body>
<div class="aurora"><div class="blob b1"></div><div class="blob b2"></div></div>
<div class="wrap">
  <p class="eyebrow">Elder Rescue Network</p>
  <h1>Organization sign-in</h1>
  <p class="subtitle">Select your organization below and enter its password to open its response dashboard — you'll only see reports assigned to you.</p>

  <input type="text" class="search" id="search" placeholder="Search your organization…" oninput="renderList()" />
  <div id="org-list"></div>

  <a class="back-link" href="/">← Back to network overview</a>
</div>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal">
    <h3>Enter password</h3>
    <div class="org-label" id="modal-org-name"></div>
    <input type="password" id="modal-password" placeholder="Password" onkeydown="if(event.key==='Enter') confirmSignIn()" />
    <div class="modal-err" id="modal-err"></div>
    <div class="modal-actions">
      <button class="cancel" onclick="closeModal()">Cancel</button>
      <button class="confirm" onclick="confirmSignIn()">Sign in</button>
    </div>
  </div>
</div>

<script>
let allOrgs = [];

async function loadOrgs(){
  try{
    const res = await fetch('/organizations');
    allOrgs = await res.json();
    renderList();
  }catch(e){
    document.getElementById('org-list').innerHTML = '<div class="empty">Could not load organizations.</div>';
  }
}

function renderList(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  const filtered = allOrgs.filter(o => o.name.toLowerCase().includes(q));
  const listEl = document.getElementById('org-list');

  if(allOrgs.length === 0){
    listEl.innerHTML = `<div class="empty">No organizations registered yet. <a href="/">Add one from the network overview →</a></div>`;
    return;
  }
  if(filtered.length === 0){
    listEl.innerHTML = `<div class="empty">No match for "${q}".</div>`;
    return;
  }
  listEl.innerHTML = filtered.map((o,i) => `
    <div class="org-card" style="animation-delay:${i*30}ms" onclick="signIn(${o.id}, '${o.name.replace(/'/g,"\\'")}')">
      <div class="name">${o.name}${o.verified ? '' : '<span class="unverified-tag">Unverified</span>'}</div>
      <div class="sub">${o.coverage_radius_km}km radius · ${o.contact_phone}</div>
    </div>
  `).join('');
}

function signIn(id, name){
  document.getElementById('modal-org-name').textContent = name;
  document.getElementById('modal-password').value = '';
  document.getElementById('modal-err').textContent = '';
  document.getElementById('modal-backdrop').dataset.orgId = id;
  document.getElementById('modal-backdrop').dataset.orgName = name;
  document.getElementById('modal-backdrop').classList.add('show');
  document.getElementById('modal-password').focus();
}

function closeModal(){
  document.getElementById('modal-backdrop').classList.remove('show');
}

async function confirmSignIn(){
  const backdrop = document.getElementById('modal-backdrop');
  const id = backdrop.dataset.orgId;
  const name = backdrop.dataset.orgName;
  const password = document.getElementById('modal-password').value;
  const errEl = document.getElementById('modal-err');
  errEl.textContent = '';

  if(!password){
    errEl.textContent = 'Enter your password.';
    return;
  }

  try{
    const res = await fetch('/organizations/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ id, password })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Sign-in failed.');

    localStorage.setItem('ngo_org_id', data.organization.id);
    localStorage.setItem('ngo_org_name', data.organization.name);
    window.location.href = '/ngo-dashboard.html';
  }catch(e){
    errEl.textContent = e.message;
  }
}

loadOrgs();
</script>
</body>
</html>
