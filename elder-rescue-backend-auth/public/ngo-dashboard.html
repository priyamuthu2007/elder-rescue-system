<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Reports — Elder Rescue Network</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F3F2FB; --paper: #FFFFFF; --ink: #1B1A2E; --ink-soft: #6B6885;
    --coral: #FF6B5B; --coral-bg: #FFE7E3; --amber: #FFA53D; --amber-bg: #FFEED9;
    --turq: #12B5A8; --turq-bg: #D6F5F1; --emerald: #21C46E; --emerald-bg: #DBF7E7;
    --violet: #7C6CF0; --violet-bg: #EAE6FE; --slate: #8A8AA3; --slate-bg: #EBEAF3;
    --grad-brand: linear-gradient(120deg, #12B5A8 0%, #7C6CF0 100%);
    --line: #E5E3F3; --radius: 16px;
    --shadow: 0 2px 4px rgba(30,25,70,0.05), 0 10px 26px rgba(30,25,70,0.07);
    --shadow-lift: 0 8px 14px rgba(30,25,70,0.09), 0 22px 44px rgba(30,25,70,0.12);
  }
  *{ box-sizing: border-box; }
  html{ -webkit-font-smoothing: antialiased; }
  body{ margin:0; color: var(--ink); font-family: 'Inter', system-ui, sans-serif; min-height:100vh; position:relative; overflow-x:hidden; background: var(--bg); }
  .aurora{ position:fixed; inset:0; z-index:-1; overflow:hidden; }
  .blob{ position:absolute; border-radius:50%; filter: blur(60px); opacity:0.3; }
  .blob.b1{ width:440px; height:440px; top:-160px; right:-120px; background: var(--turq); animation: drift1 22s ease-in-out infinite; }
  .blob.b2{ width:380px; height:380px; bottom:-180px; left:-140px; background: var(--violet); animation: drift2 26s ease-in-out infinite; }
  @keyframes drift1{ 0%,100%{ transform: translate(0,0) scale(1); } 50%{ transform: translate(-40px,30px) scale(1.08); } }
  @keyframes drift2{ 0%,100%{ transform: translate(0,0) scale(1); } 50%{ transform: translate(30px,-40px) scale(1.1); } }

  .wrap{ max-width: 900px; margin: 0 auto; padding: 30px 24px 90px; }

  header{ display:flex; justify-content:space-between; align-items:flex-start; gap: 20px; margin-bottom: 26px; flex-wrap: wrap; }
  .brand-eyebrow{
    font-family:'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    background: var(--grad-brand); -webkit-background-clip:text; background-clip:text; color:transparent;
    font-weight:600; margin: 0 0 8px;
  }
  h1{ font-family:'Fraunces', serif; font-weight: 700; font-size: 30px; margin:0; letter-spacing: -0.015em; }
  .org-badge{ display:flex; align-items:center; gap:8px; margin-top:9px; font-size:13.5px; color: var(--ink-soft); }
  .org-badge b{ color: var(--ink); }
  .switch-link{ font-size:12px; color: var(--violet); text-decoration:underline; font-weight:700; cursor:pointer; background:none; border:none; padding:0; }

  .stats{ display:grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 26px; }
  .stat{ background: var(--stat-bg, var(--paper)); border: 1px solid var(--line); border-radius: var(--radius); padding: 15px 16px; transition: transform 0.2s ease; }
  .stat:hover{ transform: translateY(-3px); }
  .stat .icon{ font-size:16px; margin-bottom:6px; display:block; }
  .stat .n{ font-family:'Fraunces', serif; font-size: 26px; font-weight: 700; line-height:1; }
  .stat .lbl{ font-size: 11px; color: var(--ink-soft); margin-top: 6px; text-transform: uppercase; letter-spacing: 0.05em; font-weight:600; }

  .section-title{ font-family:'Fraunces', serif; font-size: 16px; font-weight: 700; margin: 0 0 14px; }

  .feed{ display:flex; flex-direction:column; gap:13px; }
  .card{
    background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 18px 20px; box-shadow: var(--shadow); position:relative; overflow:hidden;
    animation: cardIn 0.4s cubic-bezier(0.16,1,0.3,1) backwards; transition: box-shadow 0.2s ease, transform 0.2s ease;
  }
  .card::before{ content:''; position:absolute; top:0; left:0; width:6px; height:100%; background: var(--card-color, var(--slate)); }
  .card:hover{ box-shadow: var(--shadow-lift); transform: translateY(-2px); }
  @keyframes cardIn{ from{ opacity:0; transform: translateY(12px); } to{ opacity:1; transform: translateY(0); } }
  .card.just-updated{ animation: cardIn 0.4s backwards, flashRing 1.6s ease-out; }
  @keyframes flashRing{ 0%{ box-shadow: 0 0 0 0 rgba(124,108,240,0.35), var(--shadow);} 40%{ box-shadow: 0 0 0 8px rgba(124,108,240,0.18), var(--shadow);} 100%{ box-shadow: var(--shadow);} }
  .card.status-reported{ --card-color: var(--coral); }
  .card.status-acknowledged{ --card-color: var(--amber); }
  .card.status-en_route{ --card-color: var(--turq); }
  .card.status-rescued{ --card-color: var(--emerald); }
  .card.status-closed{ --card-color: var(--slate); opacity: 0.72; }

  .card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-left:6px; }
  .report-desc{ font-size: 14.5px; line-height:1.48; margin: 0; }
  .report-thumb{ width: 60px; height: 60px; object-fit: cover; border-radius: 10px; border: 2px solid var(--paper); box-shadow: 0 0 0 1.5px var(--line); cursor: pointer; flex-shrink: 0; }
  .meta-row{ font-family:'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--ink-soft); display:flex; flex-wrap:wrap; gap: 13px; margin: 10px 0 13px; margin-left:6px; }
  .pill{ display:inline-flex; align-items:center; gap:6px; font-size: 11px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; padding: 5px 12px; border-radius: 100px; white-space:nowrap; }
  .pill-reported{ background: var(--coral-bg); color: #C43F2E; }
  .pill-acknowledged{ background: var(--amber-bg); color: #B06A00; }
  .pill-en_route{ background: var(--turq-bg); color: #0A8579; }
  .pill-rescued{ background: var(--emerald-bg); color: #158A4C; }
  .pill-closed{ background: var(--slate-bg); color: var(--ink-soft); }
  .pill-en_route .dot-live{ width:5px;height:5px;border-radius:50%; background: #0A8579; animation: pulse2 1.4s infinite; }
  @keyframes pulse2{ 0%,100%{ opacity:1; } 50%{ opacity:0.3; } }

  .tracker{ display:flex; align-items:center; margin: 16px 6px; }
  .tracker .step{ display:flex; flex-direction:column; align-items:center; flex:1; position:relative; }
  .tracker .dot{ width:13px;height:13px;border-radius:50%; background: var(--line); border: 2.5px solid var(--line); z-index:1; transition: all 0.4s ease; }
  .tracker .step.done .dot{ background: var(--turq); border-color: var(--turq); }
  .tracker .step.current .dot{ background: #fff; border-color: var(--turq); box-shadow: 0 0 0 5px var(--turq-bg); animation: currentPulse 1.6s ease-in-out infinite; transform: scale(1.15); }
  @keyframes currentPulse{ 0%,100%{ box-shadow: 0 0 0 4px var(--turq-bg); } 50%{ box-shadow: 0 0 0 7px transparent; } }
  .tracker .step.closed .dot{ background: var(--slate); border-color: var(--slate); }
  .tracker .step-label{ font-size: 9.5px; text-transform:uppercase; letter-spacing:0.04em; color: var(--ink-soft); margin-top: 7px; font-weight:600; }
  .tracker .step.done .step-label, .tracker .step.current .step-label{ color: var(--ink); }
  .tracker .bar{ position:absolute; top:5.5px; left:-50%; width:100%; height:3px; background: var(--line); z-index:0; border-radius:2px; }
  .tracker .step.done .bar, .tracker .step.current .bar{ background: var(--turq); }
  .tracker .step:first-child .bar{ display:none; }

  .card-actions{ display:flex; gap:9px; align-items:center; flex-wrap:wrap; padding-top: 14px; margin-left:6px; border-top: 1px dashed var(--line); }
  button{
    font-family:'Inter', sans-serif; font-size: 12.5px; font-weight: 700; border: none;
    background: var(--grad-brand); color: #fff; padding: 9px 16px; border-radius: 100px; cursor:pointer;
    transition: transform 0.1s ease, box-shadow 0.15s ease; box-shadow: 0 3px 10px rgba(18,181,168,0.25);
  }
  button:hover{ transform: translateY(-1px); box-shadow: 0 5px 16px rgba(18,181,168,0.35); }
  button:active{ transform: scale(0.95); }
  button.ghost{ background: var(--slate-bg); color: var(--ink-soft); box-shadow:none; }
  button.ghost:hover{ background:#E0DFEF; box-shadow:none; transform:none; }

  .note-input{ flex:1; min-width: 140px; font-size: 12.5px; padding: 9px 12px; border-radius: 100px; border: 1.5px solid var(--line); background: #FAFAFE; font-family:'Inter',sans-serif; }
  .note-input:focus{ outline:none; border-color: var(--turq); box-shadow: 0 0 0 3px var(--turq-bg); }
  .history-toggle{ font-size: 11.5px; color: var(--violet); cursor:pointer; text-decoration: underline; background:none; border:none; padding:0; font-weight:700; box-shadow:none; }
  .history-list{ margin-top:0; max-height:0; overflow:hidden; opacity:0; margin-left:6px; font-family:'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); display:flex; flex-direction:column; gap:5px; transition: max-height 0.3s ease, opacity 0.25s ease, margin-top 0.3s ease; }
  .history-list.open{ margin-top:13px; padding-top:13px; border-top: 1px dashed var(--line); max-height:300px; opacity:1; }

  .empty-state{ text-align:center; padding: 74px 20px; color: var(--ink-soft); background: var(--paper); border: 1.5px dashed var(--line); border-radius: var(--radius); }
  .empty-state .big{ font-family:'Fraunces', serif; font-size: 21px; font-weight:700; color: var(--ink); margin-bottom: 7px;}

  .signin-gate{ text-align:center; padding: 80px 20px; }
  .signin-gate a{ display:inline-block; margin-top:16px; background: var(--grad-brand); color:#fff; text-decoration:none; font-weight:700; padding: 12px 22px; border-radius:100px; font-size:13.5px; }

  .toast-stack{ position:fixed; bottom:22px; right:22px; display:flex; flex-direction:column; gap:9px; z-index:50; }
  .toast{ background: var(--grad-brand); color:#fff; font-size:12.5px; font-weight:600; padding: 12px 18px; border-radius: 12px; box-shadow: var(--shadow-lift); animation: toastIn 0.3s ease; max-width:300px; }
  .toast.err{ background: linear-gradient(120deg, #FF6B5B, #FFA53D); }
  @keyframes toastIn{ from{ opacity:0; transform: translateX(20px); } to{ opacity:1; transform: translateX(0); } }
</style>
</head>
<body>
<div class="aurora"><div class="blob b1"></div><div class="blob b2"></div></div>
<div class="wrap" id="wrap">
  <div class="signin-gate" id="signin-gate" style="display:none;">
    <p class="section-title">You're not signed in</p>
    <p style="color:var(--ink-soft); font-size:13.5px;">Sign in as your organization to see reports assigned to you.</p>
    <a href="/ngo-login.html">Go to sign-in →</a>
  </div>

  <div id="dashboard-content" style="display:none;">
    <header>
      <div>
        <p class="brand-eyebrow">Elder Rescue Network</p>
        <h1>My Reports</h1>
        <div class="org-badge">Signed in as <b id="org-name-label"></b> · <button class="switch-link" onclick="signOut()">Switch organization</button></div>
      </div>
    </header>

    <div class="stats" id="stats"></div>

    <p class="section-title">Assigned to your organization</p>
    <div class="feed" id="feed"></div>
  </div>
</div>

<div class="toast-stack" id="toast-stack"></div>

<script>
const STEPS = ['reported','acknowledged','en_route','rescued'];
const LABELS = { reported:'Reported', acknowledged:'Acknowledged', en_route:'En route', rescued:'Rescued', closed:'Closed' };
const NEXT_STEP = { reported:'acknowledged', acknowledged:'en_route', en_route:'rescued' };
const NEXT_LABEL = { reported:'Acknowledge', acknowledged:'Mark en route', en_route:'Mark rescued' };
const STAT_BG = { reported:'var(--coral-bg)', acknowledged:'var(--amber-bg)', en_route:'var(--turq-bg)', rescued:'var(--emerald-bg)' };
const STAT_ICON = { reported:'🚨', acknowledged:'👀', en_route:'🚗', rescued:'✅' };

const orgId = localStorage.getItem('ngo_org_id');
const orgName = localStorage.getItem('ngo_org_name');
let prevStatuses = {};
let openHistory = new Set();

if(!orgId){
  document.getElementById('signin-gate').style.display = 'block';
} else {
  document.getElementById('dashboard-content').style.display = 'block';
  document.getElementById('org-name-label').textContent = orgName;
  loadAll();
  setInterval(loadAll, 6000);
}

function signOut(){
  localStorage.removeItem('ngo_org_id');
  localStorage.removeItem('ngo_org_name');
  window.location.href = '/ngo-login.html';
}

function showToast(message, isErr){
  const stack = document.getElementById('toast-stack');
  const el = document.createElement('div');
  el.className = 'toast' + (isErr ? ' err' : '');
  el.textContent = message;
  stack.appendChild(el);
  setTimeout(() => { el.remove(); }, 3200);
}

async function fetchJSON(url, opts){
  const res = await fetch(url, opts);
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

function timeAgo(iso){
  const then = new Date(iso.replace(' ', 'T') + 'Z');
  const mins = Math.floor((Date.now() - then.getTime())/60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return mins + 'm ago';
  const hrs = Math.floor(mins/60);
  if(hrs < 24) return hrs + 'h ago';
  return Math.floor(hrs/24) + 'd ago';
}

function renderTracker(status){
  if(status === 'closed'){
    return '<div class="tracker">' + STEPS.map(s => `<div class="step closed"><div class="bar"></div><div class="dot"></div><div class="step-label">${LABELS[s]}</div></div>`).join('') + '</div>';
  }
  const currentIdx = STEPS.indexOf(status);
  return '<div class="tracker">' + STEPS.map((s,i) => {
    let cls = i < currentIdx ? 'done' : (i === currentIdx ? 'current' : '');
    return `<div class="step ${cls}"><div class="bar"></div><div class="dot"></div><div class="step-label">${LABELS[s]}</div></div>`;
  }).join('') + '</div>';
}

async function renderCard(report, index){
  const nextStatus = NEXT_STEP[report.status];
  const isOpen = openHistory.has(report.id);
  const justUpdated = prevStatuses[report.id] !== undefined && prevStatuses[report.id] !== report.status;

  let historyHtml = '';
  if(isOpen){
    try{
      const hist = await fetchJSON(`/reports/${report.id}/history`);
      historyHtml = `<div class="history-list open">` + (hist.length ? hist.map(h => `<div>${h.old_status} → ${h.new_status} · ${h.note ? h.note + ' · ' : ''}${h.changed_at}</div>`).join('') : '<div>No changes yet.</div>') + `</div>`;
    }catch(e){ historyHtml = `<div class="history-list open">Could not load history.</div>`; }
  }

  return `
  <div class="card status-${report.status}${justUpdated ? ' just-updated' : ''}" style="animation-delay:${Math.min(index*40,240)}ms">
    <div class="card-top">
      <div style="display:flex; gap:13px; flex:1;">
        ${report.photo_url ? `<img src="${report.photo_url}" class="report-thumb" onclick="window.open('${report.photo_url}','_blank')" />` : ''}
        <p class="report-desc">${report.description || '<em>No description provided</em>'}</p>
      </div>
      <span class="pill pill-${report.status}">${report.status === 'en_route' ? '<span class="dot-live"></span>' : ''}${LABELS[report.status]}</span>
    </div>
    <div class="meta-row">
      <span>#${report.id}</span>
      <span>${report.latitude.toFixed(4)}, ${report.longitude.toFixed(4)}</span>
      <span>${report.reporter_phone}</span>
      <span>${timeAgo(report.created_at)}</span>
    </div>
    ${renderTracker(report.status)}
    <div class="card-actions">
      ${nextStatus ? `<input class="note-input" id="note-${report.id}" placeholder="Optional note..." />` : ''}
      ${nextStatus ? `<button onclick="advance(${report.id}, '${nextStatus}')">${NEXT_LABEL[report.status]}</button>` : ''}
      ${report.status !== 'closed' ? `<button class="ghost" onclick="advance(${report.id}, 'closed')">Close</button>` : ''}
      <button class="history-toggle" onclick="toggleHistory(${report.id})">${isOpen ? 'Hide' : 'View'} history</button>
    </div>
    ${historyHtml}
  </div>`;
}

async function advance(id, status){
  const noteEl = document.getElementById(`note-${id}`);
  const note = noteEl ? noteEl.value : '';
  try{
    await fetchJSON(`/reports/${id}/status`, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ status, note: note || undefined }) });
    showToast(`Report #${id} moved to "${LABELS[status]}"`);
    await loadAll();
  }catch(e){
    showToast(e.message, true);
  }
}

function toggleHistory(id){
  if(openHistory.has(id)) openHistory.delete(id); else openHistory.add(id);
  loadAll();
}

async function loadAll(){
  try{
    const reports = await fetchJSON('/reports');
    const myReports = reports.filter(r => String(r.assigned_org_id) === String(orgId));

    const counts = { reported:0, acknowledged:0, en_route:0, rescued:0 };
    myReports.forEach(r => { if(counts[r.status] !== undefined) counts[r.status]++; });

    const statsEl = document.getElementById('stats');
    statsEl.innerHTML = STEPS.map(s =>
      `<div class="stat" style="background:${STAT_BG[s]}"><span class="icon">${STAT_ICON[s]}</span><div class="n">${counts[s] || 0}</div><div class="lbl">${LABELS[s]}</div></div>`
    ).join('');

    const feedEl = document.getElementById('feed');
    const activeReports = myReports.filter(r => r.status !== 'closed');
    if(activeReports.length === 0){
      feedEl.innerHTML = `<div class="empty-state"><div class="big">No active reports</div>Reports matched to your organization will appear here.</div>`;
    } else {
      const cards = await Promise.all(activeReports.map((r,i) => renderCard(r,i)));
      feedEl.innerHTML = cards.join('');
    }
    myReports.forEach(r => prevStatuses[r.id] = r.status);
  }catch(e){
    console.error(e);
  }
}
</script>
</body>
</html>
