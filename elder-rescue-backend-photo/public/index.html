<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Elder Rescue — Response Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EEF1ED;
    --paper: #FFFFFF;
    --ink: #1C2620;
    --ink-soft: #56645B;
    --line: #D9DED6;
    --teal: #205C56;
    --teal-deep: #123834;
    --amber: #C8862A;
    --amber-bg: #FBF0DE;
    --rust: #B5502E;
    --rust-bg: #FBEAE2;
    --sage: #4C7A5B;
    --sage-bg: #E6F0E8;
    --slate: #5C6B76;
    --slate-bg: #E7EBEE;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(28,38,32,0.06), 0 4px 14px rgba(28,38,32,0.05);
  }
  *{ box-sizing: border-box; }
  html{ -webkit-font-smoothing: antialiased; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    min-height:100vh;
  }
  .wrap{
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 24px 80px;
  }

  /* ---- Header ---- */
  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap: 24px;
    margin-bottom: 26px;
    flex-wrap: wrap;
  }
  .brand-eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--teal);
    margin: 0 0 6px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight: 600;
    font-size: 34px;
    line-height:1.05;
    margin:0;
    color: var(--teal-deep);
    letter-spacing: -0.01em;
  }
  .subtitle{
    color: var(--ink-soft);
    font-size: 14.5px;
    margin-top: 6px;
    max-width: 46ch;
  }
  .live-dot{
    width:7px;height:7px;border-radius:50%;
    background: var(--sage);
    display:inline-block;
    margin-right:7px;
    box-shadow: 0 0 0 0 rgba(76,122,91,0.5);
    animation: pulse 2.2s infinite;
  }
  @keyframes pulse{
    0%{ box-shadow: 0 0 0 0 rgba(76,122,91,0.45); }
    70%{ box-shadow: 0 0 0 7px rgba(76,122,91,0); }
    100%{ box-shadow: 0 0 0 0 rgba(76,122,91,0); }
  }
  .refresh-note{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--ink-soft);
    display:flex; align-items:center;
  }

  /* ---- Stats ---- */
  .stats{
    display:grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    margin-bottom: 26px;
  }
  .stat{
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 16px;
  }
  .stat .n{
    font-family:'Fraunces', serif;
    font-size: 26px;
    font-weight: 600;
    color: var(--teal-deep);
    line-height:1;
  }
  .stat .lbl{
    font-size: 11.5px;
    color: var(--ink-soft);
    margin-top: 6px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  /* ---- Layout ---- */
  .grid{
    display:grid;
    grid-template-columns: 1fr 320px;
    gap: 24px;
    align-items:start;
  }
  @media (max-width: 880px){
    .grid{ grid-template-columns: 1fr; }
    .stats{ grid-template-columns: repeat(2,1fr); }
  }

  .section-title{
    font-family:'Fraunces', serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--teal-deep);
    margin: 0 0 12px;
    display:flex; align-items:center; justify-content:space-between;
  }

  /* ---- Report cards ---- */
  .feed{ display:flex; flex-direction:column; gap:12px; }
  .card{
    background: var(--paper);
    border: 1px solid var(--line);
    border-left: 4px solid var(--slate);
    border-radius: var(--radius);
    padding: 16px 18px;
    box-shadow: var(--shadow);
  }
  .card.status-reported{ border-left-color: var(--rust); }
  .card.status-acknowledged{ border-left-color: var(--amber); }
  .card.status-en_route{ border-left-color: var(--teal); }
  .card.status-rescued{ border-left-color: var(--sage); }
  .card.status-closed{ border-left-color: var(--slate); opacity: 0.72; }

  .card-top{
    display:flex; justify-content:space-between; align-items:flex-start; gap:12px;
  }
  .report-desc{
    font-size: 14.5px;
    line-height:1.45;
    margin: 0 0 8px;
  }
  .report-thumb{
    width: 56px; height: 56px; object-fit: cover;
    border-radius: 7px; border: 1px solid var(--line);
    cursor: pointer; flex-shrink: 0;
  }
  .meta-row{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--ink-soft);
    display:flex; flex-wrap:wrap; gap: 12px;
    margin-bottom: 12px;
  }
  .pill{
    display:inline-flex; align-items:center; gap:5px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    padding: 4px 9px;
    border-radius: 100px;
    white-space:nowrap;
  }
  .pill-reported{ background: var(--rust-bg); color: var(--rust); }
  .pill-acknowledged{ background: var(--amber-bg); color: var(--amber); }
  .pill-en_route{ background: #E3EEEC; color: var(--teal); }
  .pill-rescued{ background: var(--sage-bg); color: var(--sage); }
  .pill-closed{ background: var(--slate-bg); color: var(--slate); }

  /* progress tracker — the signature element */
  .tracker{
    display:flex; align-items:center;
    margin: 14px 0 14px;
  }
  .tracker .step{
    display:flex; flex-direction:column; align-items:center; flex:1; position:relative;
  }
  .tracker .dot{
    width:11px;height:11px;border-radius:50%;
    background: var(--line);
    border: 2px solid var(--line);
    z-index:1;
  }
  .tracker .step.done .dot{ background: var(--teal); border-color: var(--teal); }
  .tracker .step.current .dot{ background: var(--paper); border-color: var(--teal); box-shadow: 0 0 0 3px rgba(32,92,86,0.16); }
  .tracker .step.closed .dot{ background: var(--slate); border-color: var(--slate); }
  .tracker .step-label{
    font-size: 9.5px; text-transform:uppercase; letter-spacing:0.04em;
    color: var(--ink-soft); margin-top: 5px; text-align:center;
  }
  .tracker .step.done .step-label, .tracker .step.current .step-label{ color: var(--teal-deep); font-weight:600; }
  .tracker .bar{
    position:absolute; top:5px; left:-50%; width:100%; height:2px;
    background: var(--line); z-index:0;
  }
  .tracker .step.done .bar, .tracker .step.current .bar{ background: var(--teal); }
  .tracker .step:first-child .bar{ display:none; }

  .card-actions{
    display:flex; gap:8px; align-items:center; flex-wrap:wrap;
    padding-top: 12px; border-top: 1px dashed var(--line);
  }
  button{
    font-family:'Inter', sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    border: 1px solid var(--teal);
    background: var(--teal);
    color: #fff;
    padding: 7px 13px;
    border-radius: 7px;
    cursor:pointer;
    transition: transform 0.08s ease, background 0.15s ease;
  }
  button:hover{ background: var(--teal-deep); }
  button:active{ transform: scale(0.97); }
  button.ghost{
    background: transparent; color: var(--ink-soft); border-color: var(--line);
  }
  button.ghost:hover{ background: var(--slate-bg); color: var(--ink); }
  button.danger{ background: var(--rust); border-color: var(--rust); }
  button.danger:hover{ background: #93401f; }
  button:disabled{ opacity:0.4; cursor:default; }
  button:disabled:hover{ background: var(--teal); }

  .note-input{
    flex:1; min-width: 140px;
    font-family:'Inter', sans-serif;
    font-size: 12.5px;
    padding: 7px 10px;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: #FBFBFA;
  }
  .note-input:focus{ outline: 2px solid var(--teal); outline-offset: 1px; }

  .history-toggle{
    font-size: 11.5px; color: var(--ink-soft); cursor:pointer; text-decoration: underline;
    text-underline-offset: 2px; background:none; border:none; padding:0; font-weight:500;
  }
  .history-toggle:hover{ color: var(--teal-deep); background:none; }
  .history-list{
    margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line);
    font-family:'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft);
    display:none; flex-direction:column; gap: 4px;
  }
  .history-list.open{ display:flex; }

  .empty-state{
    text-align:center; padding: 60px 20px; color: var(--ink-soft);
    background: var(--paper); border: 1px dashed var(--line); border-radius: var(--radius);
  }
  .empty-state .big{ font-family:'Fraunces', serif; font-size: 20px; color: var(--teal-deep); margin-bottom: 6px;}

  /* ---- Sidebar ---- */
  .side-card{
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 18px;
    box-shadow: var(--shadow);
  }
  .side-card label{
    display:block; font-size: 11.5px; font-weight:600; color: var(--ink-soft);
    margin: 10px 0 4px; text-transform: uppercase; letter-spacing: 0.03em;
  }
  .side-card label:first-of-type{ margin-top:0; }
  .side-card input, .side-card textarea{
    width:100%; font-family:'Inter', sans-serif; font-size: 13px;
    padding: 8px 10px; border-radius: 7px; border: 1px solid var(--line);
    background: #FBFBFA;
  }
  .side-card input:focus, .side-card textarea:focus{ outline: 2px solid var(--teal); outline-offset: 1px; }
  .side-card textarea{ resize: vertical; min-height: 54px; }
  .side-card .row2{ display:grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .side-card button{ width:100%; margin-top: 14px; padding: 9px; font-size:13px; }
  .form-msg{ font-size: 11.5px; margin-top:8px; }
  .form-msg.ok{ color: var(--sage); }
  .form-msg.err{ color: var(--rust); }

  .org-list{ display:flex; flex-direction:column; gap:8px; }
  .org-item{
    font-size: 12.5px; padding: 9px 10px; background: #FBFBFA;
    border: 1px solid var(--line); border-radius: 7px;
  }
  .org-item .name{ font-weight:600; color: var(--teal-deep); }
  .org-item .sub{ font-family:'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--ink-soft); margin-top:2px;}
  .checkbox-row{ display:flex; align-items:center; gap:7px; margin-top:10px; }
  .checkbox-row input{ width:auto; }
  .checkbox-row label{ margin:0; text-transform:none; font-weight:500; font-size:12.5px; color: var(--ink); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <p class="brand-eyebrow">Elder Rescue Network</p>
      <h1>Response Board</h1>
      <p class="subtitle">Every report from the public, routed to the nearest partner and tracked until the person is safe.</p>
    </div>
    <div class="refresh-note"><span class="live-dot"></span>Live · refreshes every 6s<br/><a href="/report.html" target="_blank" style="color:var(--teal); text-decoration:underline;">Open public reporting page →</a></div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="grid">
    <div>
      <p class="section-title">Incoming reports</p>
      <div class="feed" id="feed"></div>
    </div>

    <div>
      <div class="side-card">
        <p class="section-title" style="margin-bottom:2px;">Add organization</p>
        <label>Name</label>
        <input id="org-name" placeholder="e.g. T Nagar Elder Care Trust" />
        <label>Contact phone</label>
        <input id="org-phone" placeholder="+91..." />
        <div class="row2">
          <div><label>Latitude</label><input id="org-lat" placeholder="13.0418" /></div>
          <div><label>Longitude</label><input id="org-lng" placeholder="80.2341" /></div>
        </div>
        <label>Coverage radius (km)</label>
        <input id="org-radius" placeholder="8" />
        <div class="checkbox-row">
          <input type="checkbox" id="org-verified" checked />
          <label for="org-verified">Verified</label>
        </div>
        <button onclick="submitOrg()">Add organization</button>
        <div class="form-msg" id="org-msg"></div>
      </div>

      <div class="side-card">
        <p class="section-title" style="margin-bottom:2px;">Simulate a report</p>
        <label>Reporter phone</label>
        <input id="rep-phone" placeholder="+91..." />
        <label>Description</label>
        <textarea id="rep-desc" placeholder="What was seen, and where"></textarea>
        <div class="row2">
          <div><label>Latitude</label><input id="rep-lat" placeholder="13.04" /></div>
          <div><label>Longitude</label><input id="rep-lng" placeholder="80.235" /></div>
        </div>
        <label>Photo (optional)</label>
        <input type="file" id="rep-photo" accept="image/*" />
        <button onclick="submitReport()">Submit report</button>
        <div class="form-msg" id="rep-msg"></div>
      </div>

      <div class="side-card">
        <p class="section-title" style="margin-bottom:10px;">Partner organizations</p>
        <div class="org-list" id="org-list"></div>
      </div>
    </div>
  </div>

</div>

<script>
const STEPS = ['reported','acknowledged','en_route','rescued'];
const LABELS = { reported:'Reported', acknowledged:'Acknowledged', en_route:'En route', rescued:'Rescued', closed:'Closed' };
const NEXT_STEP = { reported:'acknowledged', acknowledged:'en_route', en_route:'rescued' };
const NEXT_LABEL = { reported:'Acknowledge', acknowledged:'Mark en route', en_route:'Mark rescued' };

let orgsCache = [];
let openHistory = new Set();

async function fetchJSON(url, opts){
  const res = await fetch(url, opts);
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

function timeAgo(iso){
  const then = new Date(iso.replace(' ', 'T') + 'Z');
  const diffMs = Date.now() - then.getTime();
  const mins = Math.floor(diffMs/60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return mins + 'm ago';
  const hrs = Math.floor(mins/60);
  if(hrs < 24) return hrs + 'h ago';
  return Math.floor(hrs/24) + 'd ago';
}

function renderTracker(status){
  if(status === 'closed'){
    return '<div class="tracker">' + STEPS.map((s,i) =>
      `<div class="step closed"><div class="bar"></div><div class="dot"></div><div class="step-label">${LABELS[s]}</div></div>`
    ).join('') + '</div>';
  }
  const currentIdx = STEPS.indexOf(status);
  return '<div class="tracker">' + STEPS.map((s,i) => {
    let cls = '';
    if(i < currentIdx) cls = 'done';
    else if(i === currentIdx) cls = 'current';
    return `<div class="step ${cls}"><div class="bar"></div><div class="dot"></div><div class="step-label">${LABELS[s]}</div></div>`;
  }).join('') + '</div>';
}

function orgName(id){
  const o = orgsCache.find(o => o.id === id);
  return o ? o.name : null;
}

async function renderCard(report){
  const org = orgName(report.assigned_org_id);
  const nextStatus = NEXT_STEP[report.status];
  const isOpen = openHistory.has(report.id);

  let historyHtml = '';
  if(isOpen){
    try{
      const hist = await fetchJSON(`/reports/${report.id}/history`);
      historyHtml = `<div class="history-list open">` +
        (hist.length ? hist.map(h => `<div>${h.old_status} → ${h.new_status} · ${h.note ? h.note + ' · ' : ''}${h.changed_at}</div>`).join('') : '<div>No changes yet.</div>') +
        `</div>`;
    }catch(e){ historyHtml = `<div class="history-list open">Could not load history.</div>`; }
  }

  return `
  <div class="card status-${report.status}">
    <div class="card-top">
      <div style="display:flex; gap:12px; flex:1;">
        ${report.photo_url ? `<img src="${report.photo_url}" class="report-thumb" onclick="window.open('${report.photo_url}','_blank')" />` : ''}
        <p class="report-desc">${report.description || '<em>No description provided</em>'}</p>
      </div>
      <span class="pill pill-${report.status}">${LABELS[report.status]}</span>
    </div>
    <div class="meta-row">
      <span>#${report.id}</span>
      <span>${report.latitude.toFixed(4)}, ${report.longitude.toFixed(4)}</span>
      <span>${report.reporter_phone}</span>
      <span>${timeAgo(report.created_at)}</span>
      ${org ? `<span>→ ${org}</span>` : `<span style="color:var(--rust)">→ unassigned</span>`}
    </div>
    ${renderTracker(report.status)}
    <div class="card-actions">
      ${nextStatus ? `<input class="note-input" id="note-${report.id}" placeholder="Optional note..." />` : ''}
      ${nextStatus ? `<button onclick="advance(${report.id}, '${nextStatus}')">${NEXT_LABEL[report.status]}</button>` : ''}
      ${report.status !== 'closed' ? `<button class="ghost" onclick="advance(${report.id}, 'closed')">Close</button>` : ''}
      <button class="history-toggle" onclick="toggleHistory(${report.id})">${isOpen ? 'Hide' : 'View'} history</button>
    </div>
    ${historyHtml}
  </div>`;
}

async function advance(id, status){
  const noteEl = document.getElementById(`note-${id}`);
  const note = noteEl ? noteEl.value : '';
  try{
    await fetchJSON(`/reports/${id}/status`, {
      method:'PATCH',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ status, note: note || undefined })
    });
    await loadAll();
  }catch(e){
    alert(e.message);
  }
}

function toggleHistory(id){
  if(openHistory.has(id)) openHistory.delete(id);
  else openHistory.add(id);
  loadAll();
}

async function loadAll(){
  try{
    const [reports, orgs] = await Promise.all([
      fetchJSON('/reports'),
      fetchJSON('/organizations')
    ]);
    orgsCache = orgs;

    // stats
    const counts = { reported:0, acknowledged:0, en_route:0, rescued:0, closed:0 };
    reports.forEach(r => counts[r.status] = (counts[r.status]||0) + 1);
    document.getElementById('stats').innerHTML = STEPS.concat('closed').map(s =>
      `<div class="stat"><div class="n">${counts[s]}</div><div class="lbl">${LABELS[s]}</div></div>`
    ).join('');

    // feed
    const feedEl = document.getElementById('feed');
    if(reports.length === 0){
      feedEl.innerHTML = `<div class="empty-state"><div class="big">No reports yet</div>Submitted reports will appear here as soon as someone files one.</div>`;
    } else {
      const cards = await Promise.all(reports.map(renderCard));
      feedEl.innerHTML = cards.join('');
    }

    // org sidebar
    const orgListEl = document.getElementById('org-list');
    orgListEl.innerHTML = orgs.length
      ? orgs.map(o => `<div class="org-item"><div class="name">${o.name}${o.verified ? '' : ' (unverified)'}</div><div class="sub">${o.coverage_radius_km}km radius · ${o.contact_phone}</div></div>`).join('')
      : '<div class="org-item">No organizations added yet.</div>';
  }catch(e){
    console.error(e);
  }
}

async function submitOrg(){
  const msgEl = document.getElementById('org-msg');
  msgEl.textContent = '';
  msgEl.className = 'form-msg';
  try{
    const body = {
      name: document.getElementById('org-name').value,
      contact_phone: document.getElementById('org-phone').value,
      latitude: parseFloat(document.getElementById('org-lat').value),
      longitude: parseFloat(document.getElementById('org-lng').value),
      coverage_radius_km: parseFloat(document.getElementById('org-radius').value) || 5,
      verified: document.getElementById('org-verified').checked
    };
    if(!body.name || !body.contact_phone || Number.isNaN(body.latitude) || Number.isNaN(body.longitude)){
      throw new Error('Fill in name, phone, latitude, and longitude.');
    }
    await fetchJSON('/organizations', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    ['org-name','org-phone','org-lat','org-lng','org-radius'].forEach(id => document.getElementById(id).value = '');
    msgEl.textContent = 'Organization added.';
    msgEl.className = 'form-msg ok';
    loadAll();
  }catch(e){
    msgEl.textContent = e.message;
    msgEl.className = 'form-msg err';
  }
}

async function submitReport(){
  const msgEl = document.getElementById('rep-msg');
  msgEl.textContent = '';
  msgEl.className = 'form-msg';
  try{
    const phone = document.getElementById('rep-phone').value;
    const lat = document.getElementById('rep-lat').value;
    const lng = document.getElementById('rep-lng').value;
    if(!phone || Number.isNaN(parseFloat(lat)) || Number.isNaN(parseFloat(lng))){
      throw new Error('Fill in reporter phone, latitude, and longitude.');
    }
    const formData = new FormData();
    formData.append('reporter_phone', phone);
    formData.append('description', document.getElementById('rep-desc').value);
    formData.append('latitude', lat);
    formData.append('longitude', lng);
    const photoFile = document.getElementById('rep-photo').files[0];
    if(photoFile) formData.append('photo', photoFile);

    const res = await fetch('/reports', { method:'POST', body: formData });
    const result = await res.json();
    if(!res.ok) throw new Error(result.error || 'Request failed');

    ['rep-phone','rep-desc','rep-lat','rep-lng'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('rep-photo').value = '';
    msgEl.textContent = result.message;
    msgEl.className = 'form-msg ok';
    loadAll();
  }catch(e){
    msgEl.textContent = e.message;
    msgEl.className = 'form-msg err';
  }
}

loadAll();
setInterval(loadAll, 6000);
</script>
</body>
</html>
